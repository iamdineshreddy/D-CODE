[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dcode"
version = "1.0.0"
description = "DCode multi-provider AI engineering command center"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "aiosqlite>=0.19",
  "typer>=0.12",
  "rich>=13.0",
  "prompt_toolkit>=3.0",
]

[project.scripts]
dcode = "cli.main:app"

[tool.setuptools]
packages = ["cli"]
py-modules = []
